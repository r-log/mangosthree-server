---
# Vendored third-party code is not analysed here: dep/ holds plain copies of zlib, bzip2,
# StormLib, recastnavigation and utf8cpp (see dep/README.md), maintained upstream.
#
# The finding that prompted this is the shape to expect. utf8cpp 4.1.1's
# find_invalid(const char*) calls strlen, which a blanket CWE-126 rule flags as "does
# not handle strings that are not NUL-terminated". Its whole contract is that the string
# IS NUL-terminated, and no core calls that overload at all -- every one of them uses
# the two-iterator form.
#
# src/modules/SD3 is ours (vendored from mangos/ScriptDev3) but carries 240k lines of
# inherited scripts that have not been triaged; it stays excluded until they are.
# Everything else under src/ -- realmd included -- is analysed.
exclude_paths:
  - "dep/**"
  - "src/modules/SD3/**"
