name: Verbatim Proof

permissions:
  contents: read

on:
  push:
    branches: [master, united, devel]
  pull_request:
    branches: [master, united, devel]

concurrency:
  group: verbatim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verbatim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Verbatim proof (both bases)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Self-tests
        run: |
          python3 src/tests/tools/verbatim.py --self-test
          python3 src/tests/tools/cast_verbatim.py --self-test
          python3 src/tests/tools/handler_verbatim.py --self-test
          python3 src/tests/tools/handler_classes.py --self-test

      - name: Spell handler moves against this change's parent
        run: python3 src/tests/tools/verbatim.py --check

      - name: Spell handler moves against the original switches
        run: python3 src/tests/tools/verbatim.py --check --original --anchor "$(git rev-parse HEAD^1)"

      - name: Cast rewrites against their base
        run: python3 src/tests/tools/cast_verbatim.py --check

      - name: Handler moves against their bases
        run: python3 src/tests/tools/handler_verbatim.py --check

      - name: Handler classes store nothing
        run: python3 src/tests/tools/handler_classes.py --check
