name: Codestyle Checks

permissions:
  contents: read

on:
  push:
    branches: [master, united, devel]
  pull_request:
    branches: [master, united]

concurrency:
  group: codestyle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-codestyle:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest
    name: Check Codestyling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Codestyling
        run: source ./.github/apps/ci/ci-codestyle.sh
