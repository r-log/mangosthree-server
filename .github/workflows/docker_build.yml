name: Docker Build

on:
  push:
    branches: [ master, united, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, united ]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Pinned so the sha-<n> tags never change length under us (the action's default is 7).
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "mangosd=$REGISTRY/$owner/mangosthree-mangosd" >> "$GITHUB_OUTPUT"
          echo "realmd=$REGISTRY/$owner/mangosthree-realmd" >> "$GITHUB_OUTPUT"

      # `latest` and `<major>.<minor>` are moved only by the newest release of this
      # repository, so re-running an older tag's workflow can never roll them back.
      # Compared against releases, not tags: the tree carries upstream's v22.03.* tags.
      - name: Decide mutable version tags
        id: guard
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          is_latest=false; minor_latest=false
          case "$tag" in
            *-*) ;;   # pre-release: immutable version tag only
            *)
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || latest=""
              [[ "$latest" =~ ^v[0-9] ]] || latest=""
              if [ -z "$latest" ] || [ "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n1)" = "$tag" ]; then
                is_latest=true
              fi
              prefix="${tag%.*}."
              top=$( { gh release list --exclude-pre-releases --exclude-drafts --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true; echo "$tag"; } \
                     | grep -F "$prefix" | sort -V | tail -n1 )
              [ "$top" = "$tag" ] && minor_latest=true
              ;;
          esac
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "minor_latest=$minor_latest" >> "$GITHUB_OUTPUT"
          echo "latest=$is_latest minor=$minor_latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for mangosd
        id: meta-mangosd
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.mangosd }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.guard.outputs.minor_latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.guard.outputs.is_latest == 'true' }}

      - name: Tags for realmd
        id: meta-realmd
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.realmd }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.guard.outputs.minor_latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.guard.outputs.is_latest == 'true' }}

      # Sequential on one builder with one cache scope: the second target reuses the
      # `build` stage the first one just compiled.
      - name: Build mangosd image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: extra/docker/Dockerfile
          target: mangosd
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta-mangosd.outputs.tags }}
          labels: ${{ steps.meta-mangosd.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build realmd image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: extra/docker/Dockerfile
          target: realmd
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta-realmd.outputs.tags }}
          labels: ${{ steps.meta-realmd.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # A green build proves nothing about the runtime image. Start each one through its
      # entrypoint (config seeding, gosu drop, shared libraries) and ask for the version.
      # On pull requests the images are loaded into the local daemon; on pushes they are
      # pulled back from the registry, so the published artefact is what gets exercised.
      - name: Smoke-test images
        env:
          MANGOSD_IMAGE: ${{ fromJSON(steps.meta-mangosd.outputs.json).tags[0] }}
          REALMD_IMAGE: ${{ fromJSON(steps.meta-realmd.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          check() {
            echo "== $1: $2 --version"
            if ! out=$(docker run --rm "$1" "$2" --version 2>&1); then
              echo "$out"; echo "::error::$2 failed to start from $1"; exit 1
            fi
            echo "$out"
            echo "$out" | grep -qE '^[0-9]+$' || { echo "::error::$2 --version printed no revision"; exit 1; }
          }
          check "$MANGOSD_IMAGE" mangosd
          check "$REALMD_IMAGE" realmd
