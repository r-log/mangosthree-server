name: Linux Build (GCC + Clang)

on:
  push:
    branches: [ master, united, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, united, devel ]
    # A pull request that touches only documentation does not need a build; the
    # Codestyle workflow still runs on every pull request, so a status always exists.
    # Pushes (master, tags) are never filtered: the nightly and the releases depend on them.
    paths-ignore:
      - '**.md'
      - 'extra/doc/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            pkg: g++
          - name: clang
            cc: clang
            cxx: clang++
            pkg: clang

    name: Build (${{ matrix.name }})

    env:
      BUILD_DIR: ${{ github.workspace }}/../build-${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             cmake ninja-build ccache             libbz2-dev default-libmysqlclient-dev             ${{ matrix.pkg }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: linux-${{ matrix.name }}-pch
          max-size: 2G

      - name: Configure the compiler cache
        run: |
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=depend_mode=true

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_DIR" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$BUILD_DIR/install"
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBUILD_TOOLS=1
          -DBUILD_MANGOSD=1
          -DBUILD_REALMD=1
          -DWITH_TESTS=1
          -DWITH_NET_TESTS=0
          -DSCRIPT_LIB_SD3=1
          -DPCH=1

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      # The s2n-bignum oracle must exist on these jobs: if it silently vanished, the kernel
      # comparisons in CryptoOracleTest would vanish with it.
      - name: Check the big-integer oracle was built
        run: cmake --build "$BUILD_DIR" --target s2n_bignum_oracle

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

      # The assembly tier of the Montgomery kernel must be the one that ran here: a
      # silent fall-back to a C++ tier (a CPU without ADX, a wiring mistake) would pass
      # every test without executing the listing. The runners have BMI2 and ADX.
      - name: Check the assembly tier ran
        run: |
          out=$("$BUILD_DIR/src/tests/mangos_tests" -only CryptoMontgomery_assembly_tier)
          echo "$out"
          echo "$out" | grep -q "tier: asm"

      # No binary of ours links the crypto library the tree used to sit on. Direct imports
      # only (readelf, not ldd): the MySQL client brings its own copy, and that one is its.
      # And no binary carries a static copy: none defines the library's entry points.
      - name: Check the import tables and the defined symbols
        run: |
          checked=0
          while IFS= read -r bin; do
            readelf -h "$bin" > /dev/null 2>&1 || continue
            checked=$((checked + 1))
            if readelf -d "$bin" | grep -E 'NEEDED.*lib(ssl|crypto)'; then
              echo "::error::$bin links the removed crypto library"
              exit 1
            fi
            if nm --defined-only "$bin" 2>/dev/null | grep -E ' (CRYPTO_malloc|EVP_MD_CTX_new|BN_new|ERR_get_error)$'; then
              echo "::error::$bin carries a static copy of the removed crypto library"
              exit 1
            fi
          done < <(find "$BUILD_DIR/src" -type f -perm -u+x -not -name '*.o' -not -name '*.a')
          echo "checked $checked binaries"
          [ "$checked" -ge 4 ]

      - name: Install
        run: cmake --install "$BUILD_DIR"

      - name: Verify the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build modified the source tree"
            git status --porcelain
            exit 1
          fi
