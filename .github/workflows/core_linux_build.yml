name: Linux Build (GCC + Clang)

on:
  push:
    branches: [ master, united, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, united ]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            pkg: g++
          - name: clang
            cc: clang
            cxx: clang++
            pkg: clang

    name: Build (${{ matrix.name }})

    env:
      BUILD_DIR: ${{ github.workspace }}/../build-${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             cmake ninja-build ccache             libssl-dev libbz2-dev default-libmysqlclient-dev             ${{ matrix.pkg }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: linux-${{ matrix.name }}-pch
          max-size: 2G

      # The same settings the Windows job runs with. pch_defines,time_macros: required for
      # units that consume a precompiled header. include_file_mtime,include_file_ctime: every
      # checkout gives the headers a fresh mtime, which would otherwise make ccache distrust
      # its direct-mode manifests. Depend mode: a miss is compiled once (the -MD output names
      # the includes) instead of being preprocessed first and compiled second; a changed
      # header still invalidates its dependents, and a header inside the PCH still does too,
      # because the PCH file itself is hashed as an input of every unit that uses it.
      - name: Configure the compiler cache
        run: |
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=depend_mode=true

      # Never the socket tests: they bind real listeners and dominate the
      # suite's wall-clock. A human asks for them, CI does not.
      - name: Configure
        run: >
          cmake -S . -B "$BUILD_DIR" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$BUILD_DIR/install"
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBUILD_TOOLS=1
          -DBUILD_MANGOSD=1
          -DBUILD_REALMD=1
          -DWITH_TESTS=1
          -DWITH_NET_TESTS=0
          -DSCRIPT_LIB_SD3=1
          -DPCH=1

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

      - name: Install
        run: cmake --install "$BUILD_DIR"

      - name: Verify the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build modified the source tree"
            git status --porcelain
            exit 1
          fi
